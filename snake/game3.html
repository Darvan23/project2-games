<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">

    <!-- Anonymous analytics (Umami): no cookies, no personal data -->
    <script>try{var q=new URLSearchParams(location.search).get("notrack");if(q==="1")localStorage.setItem("umami.disabled","1");if(q==="0")localStorage.removeItem("umami.disabled");}catch(e){}</script>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="db2eae29-f59c-4067-9ddf-e38b663fb989" data-domains="darvan.dev,darvan23.github.io"></script>
    <script>
    (function () {
        var game = 'Snake';
        var t0 = Date.now(), sent = false;
        function track(n, d) { try { if (window.umami) window.umami.track(n, d); } catch (e) {} }
        window.addEventListener("load", function () { setTimeout(function () { track("Game geopend", { game: game }); }, 1200); });
        function leave() {
            if (sent) return; sent = true;
            var s = Math.round((Date.now() - t0) / 1000);
            if (s >= 3) track("Speeltijd", { game: game, seconden: s, minuten: Math.round(s / 60) });
        }
        document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") leave(); });
        window.addEventListener("pagehide", leave);
    })();
    </script>
</head>
<body>
  <main class="game-shell">
    <div class="topbar">
      <a href="../index.html" class="back-link">Menu</a>
      <div class="title-block">
        <h1>Snake</h1>
        <p id="status">Use arrows, swipe, or tap the controls.</p>
      </div>
      <button id="restartBtn">Restart</button>
    </div>

    <div class="score-row">
      <div id="score">Score: 0</div>
      <button id="pauseBtn">Pause</button>
    </div>

    <div id="game-board" aria-label="Snake board"></div>

    <div class="touch-controls" aria-label="Snake touch controls">
      <button class="direction-btn up" type="button" data-direction="up" aria-label="Move up">↑</button>
      <button class="direction-btn left" type="button" data-direction="left" aria-label="Move left">←</button>
      <button class="direction-btn down" type="button" data-direction="down" aria-label="Move down">↓</button>
      <button class="direction-btn right" type="button" data-direction="right" aria-label="Move right">→</button>
    </div>
  </main>
  <script src="game3.js"></script>
</body>
</html>
