<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <div class="topbar">
      <a href="../index.html" class="back-link">Menu</a>
      <div class="title-block">
        <h1>Snake</h1>
        <p id="status">Use arrows, swipe, or tap the controls.</p>
      </div>
      <button id="restartBtn">Restart</button>
    </div>

    <div class="score-row">
      <div id="score">Score: 0</div>
      <button id="pauseBtn">Pause</button>
    </div>

    <div id="game-board" aria-label="Snake board"></div>

    <div class="touch-controls" aria-label="Snake touch controls">
      <button class="direction-btn up" type="button" data-direction="up" aria-label="Move up">↑</button>
      <button class="direction-btn left" type="button" data-direction="left" aria-label="Move left">←</button>
      <button class="direction-btn down" type="button" data-direction="down" aria-label="Move down">↓</button>
      <button class="direction-btn right" type="button" data-direction="right" aria-label="Move right">→</button>
    </div>
  </main>
  <script src="game3.js"></script>
</body>
</html>
